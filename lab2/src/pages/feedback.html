<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharpShark</title>
    <!-- <link rel="stylesheet" type="text/css" href="style.css"> -->
</head>
<body>
    <header>
        <img src="https://img.icons8.com/color/512/c-sharp-logo.png" alt="logo" width="30px">
        <h1>SharpShark</h1>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Головна</a>
                </li>
                <li>
                    <a href="scientific_themes.html">Навчальні теми</a>
                </li>
                <li>
                    <a href="feedback.html">Зворотній зв'язок</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <form>
                <label for="surname">Прізвище:</label>
                <input type="text" id="surname" name="surname" required><br>
                <label for="name">Ім'я:</label>
                <input type="text" id="name" name="name" required><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br>
                <label for="age">Вік:</label>
                <input type="number" id="age" name="age" required><br>
                
                <label>Чи вже вивчаєте мову C#?</label><br>
                <input type="radio" id="language_yes" name="language" value="yes" required>
                <label for="language_yes">так, я профі</label>
                <input type="radio" id="language_yes_beginner" name="language" value="yes_beginner" required>
                <label for="language_yes_beginner">так, але знаю початки</label>
                <input type="radio" id="language_plan" name="language" value="plan" required>
                <label for="language_plan">планую</label>
                <input type="radio" id="language_no" name="language" value="no" required>
                <label for="language_no">ні</label><br>

                <label for="feedback-purpose">Мета зворотнього зв’язку:</label><br>
                <select id="feedback-purpose" name="feedback-purpose" required>
                    <option value="collaboration">співпраця</option>
                    <option value="complaint">скарга на неякісний контент</option>
                    <option value="suggestion">пропозиція</option>
                    <option value="error">наявність помилки</option>
                </select><br>
                <label for="detail_message">Детально:</label><br>
                <textarea id="detail_message" name="detail_message" required></textarea><br>
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">Я погоджуюсь на обробку моїх персональних даних</label><br>
                <button>Відправити</button>
            </form>
        </section>
    </main>
    <footer>
        <h3>Контакти:</h3>
        <p>Телефон: +38 (067) 123 45 67</p>
        <p>Email: sharpshark@gmail.com</p>
        <p>Адреса: вул. Ваcильківcька, 123, Київ, Україна</p>
        <p>&copy; 2024 SharpShark. Всі права захищені.</p>
    </footer>
</body>


</html>
